services:

  db:
    image: postgis/postgis:16-3.4
    container_name: barakagive_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

  redis:
    image: redis:7
    container_name: barakagive_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: barakagive_backend
    command: sh docker/entrypoint.sh
    restart: always
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: barakagive_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  celery:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: barakagive_celery
    command: celery -A config worker -l info
    restart: always
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

  ia_service:
    build:
      context: ./ia_service
      dockerfile: Dockerfile
    container_name: barakagive_ia_service
    restart: always
    working_dir: /app
    volumes:
      - ./ia_service:/app
    env_file:
      - ./ia_service/.env
    ports:
      - "8001:8001"
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    container_name: barakagive_n8n
    restart: always
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
    name: barakagive_media_data
  n8n_data:
